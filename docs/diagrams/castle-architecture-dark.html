<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CASTLE static architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #2d3142;   /* deep warm charcoal */
      --color-ink:     #f5f5f5;   /* warm off-white */
      --color-muted:   #bfc0c0;
      --color-accent:  #f08a59;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>CASTLE: static component architecture</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="castle-architecture-dark-title castle-architecture-dark-desc">
        <title id="castle-architecture-dark-title">CASTLE static component architecture</title>
        <desc id="castle-architecture-dark-desc">Layered architecture of the header-only CASTLE library: castle_ext modules for data, I/O and protocols depend on castle building blocks, which all rest on a core foundation.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#2d3142"/>

        <!-- Zones -->
        <rect x="24" y="16" width="1232" height="128" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <rect x="36" y="20" width="204" height="12" rx="2" fill="#2d3142"/>
        <text x="40" y="29" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CASTLE_EXT · EXTENSIONS</text>

        <rect x="24" y="200" width="1232" height="408" rx="8" fill="rgba(245,245,245,0.02)" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <rect x="36" y="204" width="156" height="12" rx="2" fill="#2d3142"/>
        <text x="40" y="213" fill="#949eb2" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">CASTLE · CORE LIBRARY</text>

        <!-- Arrows (consumer → dependency), drawn before nodes -->
        <line x1="880" y1="88" x2="816" y2="88" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="224" y1="128" x2="224" y2="232" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="640" y1="128" x2="640" y2="232" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1056" y1="128" x2="1056" y2="232" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="816" y1="272" x2="880" y2="272" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="640" y1="312" x2="640" y2="376" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="1056" y1="312" x2="1056" y2="376" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- castle_ext: Data & Codecs -->
        <rect x="48" y="48" width="352" height="80" rx="6" fill="#2d3142"/>
        <rect x="48" y="48" width="352" height="80" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <rect x="56" y="54" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
        <text x="72" y="63" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DATA</text>
        <text x="224" y="88" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Data &amp; Codecs</text>
        <text x="224" y="106" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">codecs · crypto · checksums · serialization</text>
        <text x="224" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">geodetic · data · diag · filter</text>

        <!-- castle_ext: I/O & Net -->
        <rect x="464" y="48" width="352" height="80" rx="6" fill="#2d3142"/>
        <rect x="464" y="48" width="352" height="80" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <rect x="472" y="54" width="28" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
        <text x="486" y="63" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IO</text>
        <text x="640" y="88" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">I/O &amp; Net</text>
        <text x="640" y="106" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">io: can · gpio · i2c · spi · uart · rpmsg · fd</text>
        <text x="640" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">net: socket · client · server · endpoint</text>

        <!-- castle_ext: Protocols & Parsers -->
        <rect x="880" y="48" width="352" height="80" rx="6" fill="#2d3142"/>
        <rect x="880" y="48" width="352" height="80" rx="6" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <rect x="888" y="54" width="36" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.22)" stroke-width="0.8"/>
        <text x="906" y="63" fill="#949eb2" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROTO</text>
        <text x="1056" y="88" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Protocols &amp; Parsers</text>
        <text x="1056" y="106" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">coap · dns · http · mqtt · nmea · rtcm · ubx</text>
        <text x="1056" y="119" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">timing · nmea_parser · ubx_parser</text>

        <!-- castle: Math & Time -->
        <rect x="48" y="232" width="352" height="80" rx="6" fill="#2d3142"/>
        <rect x="48" y="232" width="352" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="56" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="72" y="247" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MATH</text>
        <text x="224" y="272" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Math &amp; Time</text>
        <text x="224" y="290" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">math: linalg · geometry · numeric</text>
        <text x="224" y="303" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">chrono: clocks · duration · time_point</text>

        <!-- castle: Callbacks & Events -->
        <rect x="464" y="232" width="352" height="80" rx="6" fill="#2d3142"/>
        <rect x="464" y="232" width="352" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="472" y="238" width="36" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="490" y="247" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EVENT</text>
        <text x="640" y="272" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Callbacks &amp; Events</text>
        <text x="640" y="290" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">delegate · function · sigslot · thread_pool</text>
        <text x="640" y="303" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">design_patterns: fsm · observer · singleton</text>

        <!-- castle: Containers (focal) -->
        <rect x="880" y="232" width="352" height="80" rx="6" fill="#2d3142"/>
        <rect x="880" y="232" width="352" height="80" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <rect x="888" y="238" width="28" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="902" y="247" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DS</text>
        <text x="1056" y="272" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Containers</text>
        <text x="1056" y="290" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vector · array · ring_buffer · hash_map</text>
        <text x="1056" y="303" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">string · map · heap · avl_tree</text>

        <!-- castle: Sync -->
        <rect x="464" y="376" width="352" height="80" rx="6" fill="#2d3142"/>
        <rect x="464" y="376" width="352" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="472" y="382" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="488" y="391" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNC</text>
        <text x="640" y="416" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sync</text>
        <text x="640" y="434" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mutex · shared_mutex · semaphore · atomic</text>
        <text x="640" y="447" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scoped_mutex · wait_policy</text>

        <!-- castle: Primitives -->
        <rect x="880" y="376" width="352" height="80" rx="6" fill="#2d3142"/>
        <rect x="880" y="376" width="352" height="80" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <rect x="888" y="382" width="32" height="12" rx="2" fill="transparent" stroke="rgba(245,245,245,0.40)" stroke-width="0.8"/>
        <text x="904" y="391" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASE</text>
        <text x="1056" y="416" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Primitives</text>
        <text x="1056" y="434" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">utility · memory · iterator · algorithm · bit</text>
        <text x="1056" y="447" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">optional · variant · tuple · static_storage</text>

        <!-- Annotation -->
        <text x="48" y="410" fill="#bfc0c0" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">Header-only and fixed-capacity:</text>
        <text x="48" y="432" fill="#bfc0c0" font-size="17" font-style="italic" font-family="'Instrument Serif', serif">no heap, no RTTI, no STL.</text>

        <!-- castle: Core foundation (focal) -->
        <rect x="48" y="520" width="1184" height="72" rx="6" fill="#2d3142"/>
        <rect x="48" y="520" width="1184" height="72" rx="6" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <rect x="56" y="526" width="32" height="12" rx="2" fill="transparent" stroke="rgba(240,138,89,0.50)" stroke-width="0.8"/>
        <text x="72" y="535" fill="#f08a59" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="640" y="556" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Core &amp; Status</text>
        <text x="640" y="572" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">compiler · config · types · traits · constants · error_handler · status</text>
        <text x="640" y="585" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">included by every module above</text>

        <!-- Legend -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="668" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="130" y="659" width="14" height="10" rx="2" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/>
        <text x="150" y="668" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">Foundation / most depended on</text>

        <rect x="360" y="659" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
        <text x="380" y="668" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">castle module group</text>

        <rect x="540" y="659" width="14" height="10" rx="2" fill="rgba(245,245,245,0.03)" stroke="rgba(245,245,245,0.30)" stroke-width="1"/>
        <text x="560" y="668" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">castle_ext module group</text>

        <line x1="740" y1="664" x2="772" y2="664" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="782" y="668" fill="#bfc0c0" font-size="8.5" font-family="'Geist', sans-serif">includes / depends on (main paths; all depend on core)</text>
      </svg>
    </div>
  </div>
</body>
</html>
